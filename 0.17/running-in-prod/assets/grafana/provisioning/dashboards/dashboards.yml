apiVersion: 1

providers:
  - name: forze
    orgId: 1
    folder: Forze
    type: file
    disableDeletion: false
    # Editable in place; edits are lost on restart because the files are the source of
    # truth. Copy a dashboard into your own folder before customising it.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
