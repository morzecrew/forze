exclude: ^(\.agents/)?skills/
repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: forbid-binary
    exclude: \.(png|jpg|jpeg|gif|svg|webp)$
  - id: shfmt
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Keep in sync with the ruff version pinned in uv.lock
  rev: v0.15.20
  hooks:
  - id: ruff-check
    files: ^src/.*\.py$
  - id: ruff-format
    files: ^src/.*\.py$
- repo: local
  hooks:
  - id: no-frozen-setattr-bypass
    name: Ban object.__setattr__ in src (use attrs Factory/property/OnceCell)
    entry: object\.__setattr__
    language: pygrep
    files: ^src/.*\.py$
  - id: quality
    name: Run quality checks
    entry: just quality
    pass_filenames: false
    # `just quality` gates the whole repository, not the staged files, so it must not be
    # selected by them. Without this it inherits the top-level `exclude` above and a
    # skills-only commit runs no hooks at all — which is precisely the commit the corpus
    # gate inside `just quality` exists to catch.
    always_run: true
    language: system
    stages: [pre-commit]
    args: [-s]
