[[tool.importlinter.contracts]]
name = "forze_mock never imports a sibling integration package"
type = "forbidden"
source_modules = ["forze_mock"]
forbidden_modules = [
    "forze_fastapi",
    "forze_identity",
    "forze_kits",
    "forze_dst",
