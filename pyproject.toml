as_packages = true

[[tool.importlinter.contracts]]
name = "Protect integration subpackages"
type = "protected"
protected_modules = [
    "forze_fastapi",
    "forze_mock",
    "forze_dst",
    "forze_cli",
    "forze_postgres",
    "forze_redis",
    "forze_s3",
    "forze_gcs",
    "forze_bigquery",
    "forze_clickhouse",
